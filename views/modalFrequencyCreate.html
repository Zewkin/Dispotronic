<div class="inmodal" role="dialog">
    <form role="form" name="frequency_form" class="form-horizontal" novalidate ng-submit="saveFrequency(frequency_form)">
        <div class="modal-body">
            <div class="row">
                <div class="col-xs-12">
                    <small class="text-danger" ng-show="msg">{{ msg }}</small>
                </div>
            </div>
            <div class="row">
                <div class="form-group">
                    <div class="col-xs-6">
                        <label class="pull-left text-left">{{_frequency_type}}</label>
                        <select class="form-control" name="type_id" id="type_id" ng-model="frequency.type_id" ng-options="value['type_id'] as value['type'] for (key , value) in frequency_type" ng-init="frequency.type_id = isNew?200701:frequency.type_id" required>
                            <option value="0"></option>
                        </select>
                    </div>
                    <div ng-show="frequency.type_id == 200701">
                        <div class="col-xs-6">
                            <label class="pull-left text-left">{{_frequency_day_type}}</label>
                            <select class="form-control" name="type_id" id="week_type" ng-model="week_type" ng-options="value['type_id'] as value['type'] for (key , value) in weektype" ng-init="week_type = frequency.meta_data['0']['day']==0 || isNew?1:2" ng-disabled="week_type && !isNew"
                                required>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row" ng-if="frequency.type_id == 200702">
                <div class="form-group">
                    <div class="col-xs-6">
                        <label class="pull-left text-left">{{_frequency_repeat}}</label>
                        <input type="hidden" ng-model="frequency.meta_data['0']['day']" ng-init="frequency.meta_data['0']['day']=0" />
                        <select class="form-control" name="repeats" ng-model="frequency.meta_data['0']['repeats']" ng-options="value for value in Range(1,2) track by value" ng-init="frequency.meta_data['0']['repeats'] = isNew?1:frequency.meta_data['0']['repeats']" ng-change="frequency.meta_data['0']['interval'] = frequency.meta_data['0']['repeats']==2?15:0"
                            required>
                        </select>
                    </div>
                    <div class="col-xs-6" ng-if="frequency.meta_data['0']['repeats'] == 2">
                        <label class="pull-left text-left">{{_frequency_interval}}</label>
                        <select class="form-control" name="repeat" ng-model="frequency.meta_data['0']['interval']" ng-options="value as value + ' ' + _frequency_days for value in rangeN(frequency.meta_data['0'].repeats,30) track by value" required>
                        </select>
                    </div>
                    <div class="col-xs-6" ng-if="frequency.meta_data['0']['repeats'] == 1">
                        <label class="pull-left text-left">{{_frequency_interval}}</label>
                        <select class="form-control" name="repeat" ng-model="frequency.meta_data[0]['interval']" ng-options="value as value  + ' ' + _frequency_days for (key, value) in Range(0,0) track by value" ng-init="frequency.meta_data['0'].interval=0" disabled>
                        </select>
                    </div>

                </div>
            </div>
            <div class="row" ng-if="frequency.type_id == 200701 && week_type == 1">
                <div class="form-group">
                    <div class="col-xs-6">
                        <label class="pull-left text-left">{{_frequency_repeat}}</label>
                        <input type="hidden" ng-model="frequency.meta_data[0]['day']" ng-init="frequency.meta_data[0]['day']=0" />
                        <select class="form-control" name="repeats" ng-model="frequency.meta_data['0']['repeats']" ng-options="value as value for (key, value) in Range(1,4)" ng-change="frequency.meta_data['0']['interval'] = frequency.meta_data['0']['repeats']==1?0:1">
                            <option value="0"></option>
                        </select>
                    </div>
                    <div class="col-xs-6">
                        <label class="pull-left text-left">{{_frequency_interval}}</label>
                        <select class="form-control" name="repeat" ng-model="frequency.meta_data['0']['interval']" ng-options="value as value  + ' ' + _frequency_days for (key, value) in rangeN(frequency.meta_data['0']['repeats'],7)">
                            <option value="0"></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="row" ng-if="frequency.type_id == 200701 && week_type == 2" ng-repeat="index in Range(1,7)">
                <div class="form-group" style="margin-bottom: 12px; margin-top: 14px;">
                    <div class="col-xs-6">
                        <label class="pull-left text-left">{{_frequency_repeat}}</label>
                        <input type="hidden" ng-model="frequency.meta_data[index]['day']" ng-init="frequency.meta_data[index]['day']=index" />
                        <select class="form-control" name="repeats" ng-model="frequency.meta_data[index]['repeats']" ng-options="value for value in Range(1,6) track by value" ng-change="frequency.meta_data[index]['interval'] = frequency.meta_data[index]['repeats']==1?0:1">
                            <option value=""></option>
                        </select>
                    </div>
                    <div class="col-xs-6">
                        <label class="pull-left text-left">{{_frequency_interval}}</label>
                        <select class="form-control" name="interval" ng-model="frequency.meta_data[index]['interval']" ng-options="value as value  + ' ' + _frequency_hours for value in rangeN(frequency.meta_data[index]['repeats'],12) track by value" ng-disabled="frequency.meta_data[index]['interval']==0">
                            <option value=""></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="row" ng-if="frequency.type_id == 200703">
                <div class="form-group">
                    <div class="col-xs-6">
                        <label class="pull-left text-left">{{_frequency_repeat}}</label>
                        <inptut type="hidden" ng-model="frequency.meta_data['0']['day']" ng-init="frequency.meta_data['0']['day']=0" />
                        <select class="form-control" name="repeats" ng-model="frequency.meta_data['0']['repeats']" ng-options="value for value in Range(1,1) track by value" ng-init="frequency.meta_data['0']['repeats'] = isNew?1:frequency.meta_data['0']['repeats']" required disabled>
                        </select>
                    </div>
                    <div class="col-xs-6" ng-if="frequency.meta_data['0']['repeats'] == 1">
                        <label class="pull-left text-left">{{_frequency_interval}}</label>
                        <select class="form-control" name="repeat" ng-model="frequency.meta_data[0]['interval']" ng-options="value as value  + ' ' + _frequency_months for (key, value) in Range(0,0) track by value" ng-init="frequency.meta_data['0'].interval=0" disabled>
                        </select>
                    </div>
                </div>
            </div>
            <div class="row" ng-if="frequency.type_id == 200704">
                <div class="form-group">
                    <div class="col-xs-6">
                        <label class="pull-left text-left">{{_frequency_repeat}}</label>
                        <inptut type="hidden" ng-model="frequency.meta_data['0']['day']" ng-init="frequency.meta_data['0']['day']=0" />
                        <select class="form-control" name="repeats" ng-model="frequency.meta_data['0']['repeats']" ng-options="value for value in Range(1,2) track by value" ng-init="frequency.meta_data['0']['repeats'] = isNew?1:frequency.meta_data['0']['repeats']" ng-change="frequency.meta_data['0']['interval'] = frequency.meta_data['0']['repeats']==2?11:0"
                            required>
                        </select>
                    </div>
                    <div class="col-xs-6" ng-if="frequency.meta_data['0']['repeats'] == 2">
                        <label class="pull-left text-left">{{_frequency_interval}}</label>
                        <select class="form-control" name="repeat" ng-model="frequency.meta_data['0']['interval']" ng-options="value as value + ' ' + _frequency_months for value in rangeN(frequency.meta_data['0'].repeats,12) track by value" required>
                        </select>
                    </div>
                    <div class="col-xs-6" ng-if="frequency.meta_data['0']['repeats'] == 1">
                        <label class="pull-left text-left">{{_frequency_interval}}</label>
                        <select class="form-control" name="repeat" ng-model="frequency.meta_data[0]['interval']" ng-options="value as value  + ' ' + _frequency_months for (key, value) in Range(0,0) track by value" ng-init="frequency.meta_data['0'].interval=0" disabled>
                        </select>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="row">
                    <div class="col-xs-12">
                        <div class="pull-right">
                            <button type="button" class="btn btn-white" data-dismiss="modal" ng-click="cancel()">{{_close}}
                            </button>
                            <button class="btn btn-primary" type="submit">{{_save}}</button>
                        </div>
                    </div>
                </div>
            </div>
            <input type="hidden" ng-model="frequency.customer_id" ng-init="customer.customerID">
        </div>
    </form>
</div>
