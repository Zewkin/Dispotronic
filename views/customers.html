<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h2>{{page_name}}</h2>
                    <div class="pull-right">
                        <button ng-click="showCustomerAddForm()" ng-hide="!hasPermission('CreateCustomerHandler')" class="btn btn-primary">{{_add_new}}</button>
                    </div>
                </div>
                <div class="ibox-content">
                    <div class="gridStyle" ui-grid-auto-resize ui-grid="gridCustomers"></div>
                </div>
            </div>
            <div class="ibox float-e-margins" collapse="!state_add_new_customer && !state_edit_customer">
                <div class="ibox-content">
                    <form role="form">
                        <div class="form-group">
                            <label for="performer_name">{{_name}}</label>
                            <input type="text" ng-model="savableCustomer.name" class="form-control" id="performer_name" placeholder="{{_name}}">
                        </div>

                        <div class="form-group">
                            <label for="customerDescription" class="ng-binding">{{_description}}</label>
                            <textarea id="customerDescription" ng-model="savableCustomer.description" class="form-control ng-pristine ng-valid" placeholder="Description"></textarea>
                        </div>

                        <div class="ibox-footer">
                            <button type="submit" class="btn btn-primary" ng-class="savableCustomer.name ? '' : 'disabled';" ng-click="saveCustomer();">{{_save}}</button>
                            <button type="submit" class="btn btn-primary" ng-class="savableCustomer.name ? '' : 'disabled';" ng-click="saveCustomer();" ng-hide="state_edit_customer">{{_save_continue}}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
