<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-lg-3">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h2>{{_customers}}</h2>
                </div>
                <div class="ibox-content">
                    <div class="gridCustomers" ui-grid="gridCustomers" ui-grid-selection ui-grid-auto-resize></div>
                </div>
            </div>
        </div>
        <div class="col-lg-9" ng-if="gridCustomersApi.selection.getSelectedCount() > 0">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h2>{{_frequency}}</h2>
                    <div class="pull-right">
                        <div class="btn-group">
                            <button class="btn btn-white" ng-click="frequencyForm('md', true)"><i class="fa fa-plus-square-o"></i></button>
                            <button class="btn btn-white" ng-if="gridFrequencyApi.selection.getSelectedCount() > 0" ng-click="deleteFrequency()"><i class="fa fa-trash-o"></i></button>
                            <button class="btn btn-white" ng-if="gridFrequencyApi.selection.getSelectedCount() > 0" ng-click="frequencyForm('md')"><i class="fa fa-pencil-square-o"></i></button>
                        </div>
                    </div>
                </div>
                <div class="ibox-content" ng-hide="gridFrequency.data.length==0">
                    <div class="KeyFigures" ui-grid="gridFrequency" ui-grid-selection ui-grid-auto-resize></div>
                </div>
            </div>
        </div>
    </div>
</div>
